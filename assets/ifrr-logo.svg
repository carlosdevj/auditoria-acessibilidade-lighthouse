<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc">
  <title id="title">Marca institucional do Instituto Federal de Educação, Ciência e Tecnologia de Roraima</title>
  <desc id="desc">Marca horizontal do IFRR com símbolo dos Institutos Federais à esquerda e o nome Instituto Federal Roraima à direita.</desc>
  <rect x="4" y="4" width="752" height="212" rx="24" fill="#ffffff" stroke="#d7e0db" stroke-width="8"/>
  <g transform="translate(32 26)">
    <g fill="#1d8e3f">
      <rect x="0" y="0" width="44" height="44" rx="4"/>
      <rect x="52" y="0" width="44" height="44" rx="4"/>
      <rect x="0" y="52" width="44" height="44" rx="4"/>
      <rect x="52" y="52" width="44" height="44" rx="4"/>
      <rect x="104" y="52" width="44" height="44" rx="4"/>
      <rect x="0" y="104" width="44" height="44" rx="4"/>
      <rect x="52" y="104" width="44" height="44" rx="4"/>
      <rect x="104" y="104" width="44" height="44" rx="4"/>
      <rect x="0" y="156" width="44" height="44" rx="4"/>
      <rect x="52" y="156" width="44" height="44" rx="4"/>
    </g>
    <circle cx="126" cy="22" r="22" fill="#d9242e"/>
  </g>
  <g transform="translate(230 48)" font-family="Arial, Helvetica, sans-serif" fill="#1c1c1c">
    <text x="0" y="42" font-size="40" font-weight="700" letter-spacing="1">INSTITUTO FEDERAL</text>
    <text x="0" y="84" font-size="26" font-weight="700" letter-spacing="0.4">Educação, Ciência e Tecnologia</text>
    <text x="0" y="146" font-size="54" font-weight="700" fill="#1d8e3f">Roraima</text>
